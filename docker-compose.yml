# docker compose run --rm pipeline              # tests on the built-in test grid (~30 s)
# docker compose run --rm pipeline make all     # real data: download, prepare, build, export (~30–60 min)
#   db        PostgreSQL 16 + PostGIS 3.4 + pgRouting, on localhost:5433 (gis / gis / access)
#   pipeline  Python 3.12 + osmium-tool; the repository is mounted at /app
services:
  db:
    build: { context: ., dockerfile: docker/db.Dockerfile }
    environment:
      POSTGRES_DB: access
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    command: postgres -c shared_buffers=1GB -c work_mem=256MB -c maintenance_work_mem=1GB
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d access"]
      interval: 3s
      timeout: 3s
      retries: 30

  pipeline:
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      PGHOST: db
      PGDATABASE: access
      PGUSER: gis
      PGPASSWORD: gis
    volumes: [".:/app"]
    depends_on:
      db: { condition: service_healthy }
    command: python tests/run_tests.py

volumes:
  pgdata:
