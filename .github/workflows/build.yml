name: build

# Downloads the real data, runs the analysis and commits the results
# (docs/data for the web map, docs/img, results/). Start it from the Actions tab
# ("Run workflow"); it also runs on the 1st of every month with fresh OSM data.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Tests (test grid)
        run: python tests/run_tests.py

      # Source files are cached between runs; the monthly run fetches a fresh OSM extract.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Download sources
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then rm -f data/raw/turkey-latest.osm.pbf; fi
          python scripts/download.py

      - name: Prepare (OSM extract, road graph, population cells)
        run: python -u scripts/prepare.py

      - name: Build database and route
        run: python -u scripts/build.py

      - name: Export web map, results and figure
        run: |
          python scripts/export_web.py
          python scripts/make_figure.py
          cp data/raw/SOURCES.json results/SOURCES.json

      - name: Upload results as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            docs/data/
            docs/img/
            data/work/*/prepare.json

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/data docs/img
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update results ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
