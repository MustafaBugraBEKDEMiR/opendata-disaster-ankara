name: tests

# Runs the whole pipeline on the built-in test grid (tests/run_tests.py) on every push.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python tests/run_tests.py
